name: Windows build and release
on:
  pull_request:
  push:
    branches: [main, 'prerelease/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/raysculpt-mamba/pkgs
          key: raysculpt-windows-sdk-${{ hashFiles('tools/windows-sdk.lock') }}
      - name: Install native build dependencies
        timeout-minutes: 16
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sdk="$env:RUNNER_TEMP/raysculpt-sdk"
          $env:MAMBA_ROOT_PREFIX="$env:RUNNER_TEMP/raysculpt-mamba"
          Invoke-WebRequest 'https://micro.mamba.pm/api/micromamba/win-64/2.10.0' -OutFile "$env:RUNNER_TEMP/mamba.tar.bz2"
          if((Get-FileHash "$env:RUNNER_TEMP/mamba.tar.bz2").Hash -ne '6283F25F8142606D86E81A43C7103B5D4F1D5C2027E3F9D7326EFF23B33930D8'){throw 'micromamba checksum mismatch'}
          tar -xjf "$env:RUNNER_TEMP/mamba.tar.bz2" -C "$env:RUNNER_TEMP" Library/bin/micromamba.exe
          & "$env:RUNNER_TEMP/Library/bin/micromamba.exe" create -y -p $sdk --file ./tools/windows-sdk.lock
          if($LASTEXITCODE){exit $LASTEXITCODE}
          rustup default stable-x86_64-pc-windows-msvc
          if($LASTEXITCODE){exit $LASTEXITCODE}
          "RAYSCULPT_SDK=$sdk/Library" >> $env:GITHUB_ENV
      - name: Build and test CAD and optics
        shell: pwsh
        run: ./tools/build_native.ps1 -Sdk $env:RAYSCULPT_SDK
      - name: Test packaged application and prepare archive
        shell: pwsh
        run: |
          ./tools/package_native.ps1 -Sdk $env:RAYSCULPT_SDK -PackageCache "$env:RUNNER_TEMP/raysculpt-mamba/pkgs"
          ./tests/native_runtime.ps1 -Package build/native/portable
          ./tools/archive_native.ps1 -Package build/native/portable
      - uses: actions/upload-artifact@v4
        with:
          name: RaySculpt-Windows-x64
          path: build/releases/*
          if-no-files-found: error

  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RaySculpt-Windows-x64
          path: release
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test "$TAG" = "v$(cat VERSION)"
          cd release
          sha256sum --check *.sha256
          gh release create "$TAG" *.zip *.sha256 --verify-tag --title "RaySculpt $TAG" --notes-file ../CHANGELOG.md
