name: Windows build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
      - name: Install desktop libraries
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Test native engine
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test desktop and CAD export
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Package
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: RaySculpt-Windows-x64
          path: build/releases/*
          if-no-files-found: error

  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RaySculpt-Windows-x64
          path: release
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test "$TAG" = "v$(cat VERSION)"
          cd release
          sha256sum --check *.sha256
          gh release create "$TAG" *.zip *.sha256 --verify-tag --title "RaySculpt $TAG" --notes-file ../CHANGELOG.md
